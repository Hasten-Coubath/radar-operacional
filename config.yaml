project:
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  gold_dir: data/gold
  db_path: data/processed/radar.db
  prompts_dir: prompts
  reports_dir: reports

llm:
  provider: anthropic
  # live: usa o cache e chama a API nos misses.
  # cache_only: só lê o cache; um miss gera erro (modo reprodutível, custo zero).
  mode: live
  cache_dir: cache/llm
  usage_log: logs/llm_usage.jsonl
  timeout_s: 60
  max_retries: 2

  # Um papel = um uso do LLM no projeto. Modelo e parâmetros por papel.
  roles:
    classifier:
      model: claude-haiku-5-5   # pequeno e barato, para classificação em lote
      max_tokens: 1024
      effort: low
    agent:
      model: claude-opus-5-5    # provisório; escolha final justificada na Fase 8
      max_tokens: 16000
      effort: medium

  # USD por milhão de tokens. Fonte: tabela de preços da Anthropic (consultada em 2026-10).
  # cache_read/cache_write opcionais; se ausentes, são cobrados ao preço de input.
  pricing_usd_per_mtok:
    claude-haiku-5-5: {input: 0.10, output: 0.50}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}

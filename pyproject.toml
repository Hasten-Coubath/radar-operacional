[project]
name = "radar-operacional"
version = "0.0.1"
description = "Alerta precoce de problemas operacionais em e-commerce a partir de avaliações de clientes"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# testes que chamam o Ollama local ficam fora da execução padrão: `pytest -m ollama`
addopts = '-m "not ollama"'
markers = ["ollama: chama o servidor Ollama local de verdade (lento, requer GPU/modelo)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
